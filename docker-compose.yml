# Lancement : docker compose up --build
# Premier démarrage : docker compose exec ollama ollama pull qwen2.5:1.5b
services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: .
    environment:
      RAG_OLLAMA_URL: http://ollama:11434
      RAG_DOCS_DIR: /app/data/docs
      RAG_CHROMA_DIR: /app/data/chroma_db
      RAG_STATE_FILE: /app/data/ingest_state.json
      RAG_CORS_ORIGINS: http://localhost:8501
      # RAG_LLM_MODEL: qwen2.5:3b
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  frontend:
    build: .
    command: ["streamlit", "run", "frontend/streamlit_app.py",
              "--server.address", "0.0.0.0", "--server.port", "8501",
              "--server.fileWatcherType", "none"]
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  ollama_models:
  hf_cache:
